name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Restore locked dependencies
        run: dotnet restore WotBTreader.sln --locked-mode
      - name: Verify formatting
        run: dotnet format WotBTreader.sln --verify-no-changes --no-restore
      - name: Build release
        run: dotnet build WotBTreader.sln -c Release --no-restore
      - name: Test
        run: dotnet test WotBTreader.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Audit vulnerable packages
        run: dotnet list WotBTreader.sln package --vulnerable --include-transitive
      - name: Scan tracked repository
        shell: pwsh
        run: ./scripts/scan-repository.ps1
      - name: Check offline discovery pack (links + file-tree freshness)
        shell: pwsh
        run: python scripts/python/offline_check.py --check-fresh
      - name: Validate tool registry JSON
        shell: pwsh
        run: python -c "import json,sys; json.load(open('tools/external/tools.lock.json', encoding='utf-8'))"
