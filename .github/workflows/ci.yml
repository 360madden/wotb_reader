name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore locked dependencies
        run: dotnet restore WotBTreader.sln --locked-mode
      - name: Verify formatting
        run: dotnet format WotBTreader.sln --verify-no-changes --no-restore
      - name: Build release
        run: dotnet build WotBTreader.sln -c Release --no-restore
      - name: Test
        run: dotnet test WotBTreader.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Scan tracked repository
        shell: pwsh
        run: ./scripts/scan-repository.ps1
